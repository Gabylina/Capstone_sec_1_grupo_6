# Docker Compose para desarrollo (construye imágenes localmente)
# Para usar imágenes de Docker Hub en producción, usa: docker-compose -f docker-compose.prod.yml up -d
# 
# Para cambiar a usar imágenes del Docker Hub, reemplaza las secciones 'build:' con 'image:'
# Ejemplo:
#   backend:
#     image: niconav1/llconsulting:backend
#     # (elimina la sección 'build:')

services:
  # Base de datos PostgreSQL
  # Para usar imagen personalizada de Docker Hub, reemplaza con:
  # image: niconav1/llconsulting:postgresql
  postgres:
    image: postgres:16-alpine
    container_name: llconsulting_db
    environment:
      POSTGRES_DB: defaultdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d defaultdb"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - llconsulting_network

  # Backend API
  # Para usar imagen de Docker Hub, reemplaza 'build:' con:
  # image: niconav1/llconsulting:backend
  backend:
    build:
      context: ./Base de datos
      dockerfile: Dockerfile
    container_name: llconsulting_backend
    environment:
      DB_HOST: ${DB_HOST:-database-llconsulting-database-llconsulting.d.aivencloud.com}
      DB_PORT: ${DB_PORT:-23264}
      DB_NAME: ${DB_NAME:-defaultdb}
      DB_USER: ${DB_USER:-avnadmin}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      PORT: 3001
      NODE_ENV: production
      TZ: America/Santiago
      JWT_SECRET: ${JWT_SECRET:-secret}
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: ${FRONTEND_URL:-https://web.llconsulting.cl}
      MAIL_ENABLED: ${MAIL_ENABLED:-false}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-2525}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:-LL Consulting <noreply@llconsulting.cl>}
      UPLOAD_PATH: ./uploads
      MAX_FILE_SIZE: 52428800
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100000
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    # Base de datos externa en Aiven Cloud, no depende del servicio postgres local
    networks:
      - llconsulting_network
    restart: unless-stopped

  # Frontend Next.js
  # Para usar imagen de Docker Hub, reemplaza 'build:' con:
  # image: niconav1/llconsulting:frontend
  frontend:
    build:
      context: ./Aplicación
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: https://web.llconsulting.cl/api
    container_name: llconsulting_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-https://web.llconsulting.cl/api}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - llconsulting_network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
  backend_logs:

networks:
  llconsulting_network:
    driver: bridge

