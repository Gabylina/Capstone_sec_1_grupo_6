# Docker Compose para producción usando imágenes de Docker Hub
# Uso: docker-compose -f docker-compose.prod.yml up -d
# 
# IMPORTANTE: Antes de usar este archivo, asegúrate de:
# 1. Haber subido las imágenes a Docker Hub usando: .\push-to-dockerhub.ps1
# 2. Configurar la variable de entorno DOCKER_HUB_USERNAME con tu usuario de Docker Hub
#    Ejemplo: $env:DOCKER_HUB_USERNAME = "niconav1"
# 3. O editar manualmente las líneas de 'image:' con tu usuario

services:
  # Base de datos PostgreSQL
  # Si tienes una imagen personalizada en Docker Hub, descomenta y ajusta:
  # postgres:
  #   image: ${DOCKER_HUB_USERNAME:-niconav1}/llconsulting:postgresql
  #   container_name: llconsulting_db
  #   environment:
  #     POSTGRES_DB: defaultdb
  #     POSTGRES_USER: postgres
  #     POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
  #   ports:
  #     - "5432:5432"
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U postgres"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   networks:
  #     - llconsulting_network
  
  # Por defecto, usar imagen oficial (recomendado para producción)
  postgres:
    image: postgres:16-alpine
    container_name: llconsulting_db
    environment:
      POSTGRES_DB: defaultdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres123}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - llconsulting_network

  # Backend API - Usando imagen de Docker Hub
  backend:
    image: ${DOCKER_HUB_USERNAME:-niconav1}/llconsulting:backend
    container_name: llconsulting_backend
    environment:
      DB_HOST: ${DB_HOST:-database-llconsulting-database-llconsulting.d.aivencloud.com}
      DB_PORT: ${DB_PORT:-23264}
      DB_NAME: ${DB_NAME:-defaultdb}
      DB_USER: ${DB_USER:-avnadmin}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      PORT: 3001
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-secret}
      JWT_EXPIRES_IN: 24h
      FRONTEND_URL: ${FRONTEND_URL:-http://138.197.127.184}
      UPLOAD_PATH: ./uploads
      MAX_FILE_SIZE: 10485760
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100000
    ports:
      - "3001:3001"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    # Base de datos externa en Aiven Cloud, no depende del servicio postgres local
    networks:
      - llconsulting_network
    restart: unless-stopped

  # Frontend Next.js - Usando imagen de Docker Hub
  frontend:
    image: ${DOCKER_HUB_USERNAME:-niconav1}/llconsulting:frontend
    container_name: llconsulting_frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://138.197.127.184:3001}
      NODE_ENV: production
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - llconsulting_network
    restart: unless-stopped

volumes:
  postgres_data:
  backend_uploads:
  backend_logs:

networks:
  llconsulting_network:
    driver: bridge

